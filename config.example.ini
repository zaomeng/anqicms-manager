# AnqiCMS 站群管理工具示例配置
# 使用方法：复制本文件为 config.ini，并将占位域名与 Token 替换为真实站点信息。
# 注意：config.ini 包含站点 Token 与后台凭据，切勿提交到公开仓库！

[example_main]
fid = 1
category_keywords = {}
url = https://example.com
jiekou = https://example.com/api/import/archive?token=REPLACE_WITH_YOUR_IMPORT_TOKEN
publish_dir = ./文章目录/example_main
daily_publish_filename = ./设置/站点状态/example_main_daily.txt
publish_time = 06:00:00
publish_times = 06:00:00
interval_time = 60
daily_publish_limit = 60
enabled = false
image_file =
site_id = 11111111-1111-4111-8111-111111111111
category_name = 默认栏目
gallery_id =
article_warning_threshold = 500
activation_date = 2026-01-01
site_title = 示例主站|示例主站官网
site_group = 默认分组
mcp_token = REPLACE_WITH_YOUR_MCP_TOKEN
admin_username = admin
admin_password = REPLACE_WITH_YOUR_ADMIN_PASSWORD

[example_sitegroup]
fid = 0
category_keywords = {}
url = https://site2.example.com
jiekou =
publish_dir = ./文章目录/example_sitegroup
daily_publish_filename = ./设置/站点状态/example_sitegroup_daily.txt
publish_time = 06:00:00
publish_times = 06:00:00
interval_time = 60
daily_publish_limit = 60
enabled = false
image_file =
site_id = 22222222-2222-4222-8222-222222222222
category_name =
gallery_id =
article_warning_threshold = 500
activation_date = 2026-01-01
site_title = 示例站群二号
site_group = 站群组A
mcp_token = REPLACE_WITH_YOUR_MCP_TOKEN
